<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOXIC SECTOR — a Duke-style FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  #c { display: block; width: 100vw; height: 100vh; }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(2,4,8,0.88); color: #cfe; text-align: center; cursor: pointer;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { color: #6f6; text-shadow: 0 0 14px #6f6, 0 0 50px #4f4; font-size: clamp(34px,7vw,64px); letter-spacing: 8px; margin-bottom: 18px; }
  .overlay p { line-height: 1.9; max-width: 640px; padding: 0 16px; font-size: 15px; color: #9cb; }
  .overlay .keys { color: #6ff; margin-top: 18px; }
  .overlay .go { margin-top: 26px; color: #ff6; text-shadow: 0 0 10px #ff6; animation: blink 1.1s steps(2) infinite; font-size: 18px; letter-spacing: 3px; }
  @keyframes blink { 50% { opacity: 0; } }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #6f6; font-size: 18px; text-shadow: 0 0 6px #6f6; }
  #stats {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 14px 22px; font-size: 26px; font-weight: bold; letter-spacing: 2px;
    background: linear-gradient(transparent, rgba(0,0,0,0.65));
  }
  #hp { color: #f55; text-shadow: 0 0 8px #f33; }
  #hp.low { animation: blink 0.6s steps(2) infinite; }
  #ammo { color: #fc3; text-shadow: 0 0 8px #fa0; }
  #weapon-name { font-size: 13px; color: #9ab; letter-spacing: 3px; }
  #score-line { position: absolute; top: 12px; right: 20px; text-align: right; color: #6ff; font-size: 18px; letter-spacing: 2px; text-shadow: 0 0 8px #0cc; }
  #key-line { color: #f44; font-size: 14px; margin-top: 4px; text-shadow: 0 0 8px #f00; }
  #msg { position: absolute; top: 16%; left: 0; right: 0; text-align: center; color: #cfe; font-size: 17px; letter-spacing: 1px; text-shadow: 0 0 6px #000; opacity: 0; transition: opacity 0.3s; }
  #quip { position: absolute; bottom: 110px; left: 0; right: 0; text-align: center; color: #ff6; font-size: 22px; font-style: italic; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 10px #f80, 2px 2px 0 #000; opacity: 0; transition: opacity 0.25s; }
  #dmg { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,0.45) 100%); opacity: 0; }
  #dmg-arrow { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: center; color: #f33; font-size: 46px; text-shadow: 0 0 12px #f00; opacity: 0; transition: opacity 0.2s; transform: translate(-50%,-50%); }
  #pickup-flash { position: absolute; inset: 0; background: rgba(255,255,160,0.18); opacity: 0; }
  #dialog {
    position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    max-width: 560px; min-width: 380px; padding: 14px 20px;
    background: rgba(0,12,24,0.88); border: 1px solid #6ff; color: #cfe;
    font-size: 15px; line-height: 1.6; display: none;
  }
  #dialog .who { color: #6ff; font-weight: bold; letter-spacing: 2px; }
  #dialog .hint { color: #678; font-size: 12px; margin-top: 8px; }
  #end-rank { font-size: clamp(70px,16vw,150px); font-weight: bold; line-height: 1; margin-bottom: 6px; text-shadow: 0 0 30px currentColor; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="crosshair">+</div>
  <div id="msg"></div>
  <div id="quip"></div>
  <div id="dmg"></div>
  <div id="dmg-arrow">▲</div>
  <div id="pickup-flash"></div>
  <div id="score-line">SCORE 0<div id="key-line"></div></div>

  <div id="stats">
    <div><span id="hp">100</span><div id="weapon-name">BLASTER</div></div>
    <div style="text-align:right"><span id="ammo">∞</span><div style="font-size:13px;color:#9ab;letter-spacing:3px">AMMO</div></div>
  </div>
</div>

<div class="overlay" id="intro">
  <h1>TOXIC SECTOR</h1>
  <p id="intro-sub" style="color:#6ff;letter-spacing:3px;font-size:15px;margin-bottom:10px"></p>
  <p id="intro-body"></p>
  <p class="keys">WASD move · MOUSE look · CLICK shoot · 1/2/3/4 weapons<br>E use / talk · SPACE jump · SHIFT walk · P quality</p>
  <p class="go">CLICK TO ENTER THE SECTOR</p>
</div>

  <p class="go" id="end-go">CLICK TO CONTINUE</p>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// Dynamic level load: ?level=level2 (default level.js). Carry-over loadout in sessionStorage.
const PARAMS = new URLSearchParams(location.search);
const LEVEL_FILE = (PARAMS.get('level') || 'level').replace(/[^a-z0-9]/gi, '');
const L = await import(`./${LEVEL_FILE}.js`);
const { CELL, WALL_H, GRID_W, GRID_H, grid, playerStart, meta,
        doors: doorDefs, monsters: monsterDefs, items: itemDefs, npcs: npcDefs,
        crates: crateDefs, lights: lightDefs, exit: exitDef, bossArena,
        barrels: barrelDefs = [], sludge: sludgeDefs = [] } = L;
const KEY_COLOR = meta.keyColor ?? 0xff3333;
const KEY_NAME = meta.keyName ?? 'RED KEYCARD';

// ============================== UTIL ==============================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cx = g => (g + 0.5) * CELL;          // grid -> world center

// ============================== AUDIO ==============================
let actx = null;
const audio = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());
function beep(freq, dur, type = 'square', vol = 0.07, slide = 0, delay = 0) {
  try {
    const a = audio(); if (a.state === 'suspended') a.resume();
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function noise(dur, vol = 0.1, freq = 1000) {
  try {
    const a = audio(); if (a.state === 'suspended') a.resume();
    const len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  } catch (e) {}
}
const sfx = {
  pistol:  () => { noise(0.08, 0.12, 2500); beep(220, 0.07, 'square', 0.06, -120); },
  shotgun: () => { noise(0.22, 0.25, 1200); beep(90, 0.18, 'sawtooth', 0.12, -50); },
  plasma:  () => beep(900, 0.12, 'sawtooth', 0.07, -550),
  hurt:    () => beep(160, 0.2, 'sawtooth', 0.12, -80),
  mDie:    () => { noise(0.3, 0.15, 700); beep(140, 0.35, 'sawtooth', 0.1, -100); },
  mHit:    () => beep(300, 0.08, 'square', 0.05, -100),
  pickup:  () => { beep(660, 0.07, 'square', 0.06); beep(990, 0.1, 'square', 0.06, 0, 0.07); },
  gold:    () => { beep(880, 0.06, 'triangle', 0.09); beep(1320, 0.12, 'triangle', 0.09, 0, 0.06); },
  door:    () => beep(60, 0.5, 'sawtooth', 0.08, 60),
  spit:    () => beep(400, 0.15, 'sawtooth', 0.05, -250),
  boom:    () => { noise(0.5, 0.3, 500); beep(60, 0.6, 'sawtooth', 0.15, -30); },
  secret:  () => { [440, 554, 659, 880].forEach((f, i) => beep(f, 0.12, 'triangle', 0.08, 0, i * 0.09)); },
  win:     () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, 'square', 0.08, 0, i * 0.13)); },
};

// ---- ambient music: low detuned drone through a swept lowpass; combat raises the cutoff ----
let music = null;
function startMusic() {
  if (music) return;
  try {
    const a = audio();
    const master = a.createGain(); master.gain.value = 0.05; master.connect(a.destination);
    const filt = a.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 160; filt.Q.value = 5;
    filt.connect(master);
    for (const [f, type, vol] of [[55, 'sawtooth', 0.32], [55.7, 'sawtooth', 0.32], [27.5, 'sine', 0.7]]) {
      const o = a.createOscillator(); o.type = type; o.frequency.value = f;
      const g = a.createGain(); g.gain.value = vol;
      o.connect(g).connect(filt); o.start();
    }
    const lfo = a.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = a.createGain(); lfoG.gain.value = 50;
    lfo.connect(lfoG).connect(filt.frequency); lfo.start();
    music = { filt, master, intensity: 0, clangT: 5 };
  } catch (e) {}
}

// ---- one-liners (text + speech synth) ----
const quipEl = document.getElementById('quip');
let quipTimer = null, lastQuipAt = 0;
function quip(text, force = false) {
  const now = performance.now();
  if (!force && now - lastQuipAt < 4000) return;
  lastQuipAt = now;
  quipEl.textContent = '“' + text + '”';
  quipEl.style.opacity = 1;
  clearTimeout(quipTimer);
  quipTimer = setTimeout(() => quipEl.style.opacity = 0, 2600);
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = 0.3; u.rate = 0.95; u.volume = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const KILL_QUIPS = ['Eat lead, slimeball!', 'Is that all you got?', 'Back to the sewer!', 'Recycled. Permanently.', 'Take out the trash? Done.'];

// ============================== MESSAGES ==============================
const msgEl = document.getElementById('msg');
let msgTimer = null;
function msg(t, ms = 2200) {
  msgEl.textContent = t; msgEl.style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msgEl.style.opacity = 0, ms);
}

// ============================== RENDERER / SCENE ==============================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
let QUALITY = true; // P toggles post+shadows

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
scene.fog = new THREE.FogExp2(0x05080c, 0.024);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// dim base light so colored point lights and emissive panels carry the mood;
// halls read dark + industrial instead of flat grey wash.
scene.add(new THREE.AmbientLight(0x2a3340, 1.1));
scene.add(new THREE.HemisphereLight(0x2c3c50, 0x100a06, 0.55));

// ============================== TEXTURES ==============================
const texLoader = new THREE.TextureLoader();
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function pbr(name, repeat = 1) {
  const make = suffix => {
    const t = texLoader.load(`assets/${name}_1K-JPG_${suffix}.jpg`);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat, repeat);
    t.anisotropy = MAX_ANISO;
    if (suffix === 'Color') t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  return new THREE.MeshStandardMaterial({
    map: make('Color'), normalMap: make('NormalGL'), roughnessMap: make('Roughness'),
  });
}
const matWallA  = pbr('MetalPlates006');
const matWallB  = pbr('Rust004');
const matWallC  = pbr('PaintedMetal013');
const matFloor  = pbr('Concrete034', 24);
const matCeil   = pbr('Metal032', 24);
const matCrate  = pbr('Planks021');
const matDoor   = pbr('MetalPlates007');
const matCeilTile = pbr('Metal032', 1.5);

// skybox (visible through the open-air boss arena roof)
texLoader.load('assets/sprites/skybox.jpg', t => {
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
  scene.environment = t; // env-map gloss: metal actually reflects now
  for (const m of [matWallA, matWallB, matWallC, matFloor, matCeil, matCrate, matDoor, matCeilTile])
    m.envMapIntensity = 0.18;
});

function spriteTex(name) {
  const t = texLoader.load(`assets/sprites/${name}.png`);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}
// sprites need an emissive lift: the painted art is pre-lit, pure Lambert goes near-black in dark halls
function spriteMat(map, extra = {}) {
  return new THREE.MeshLambertMaterial({
    map, transparent: true, alphaTest: 0.4, side: THREE.DoubleSide,
    emissive: 0xffffff, emissiveMap: map, emissiveIntensity: 0.32, ...extra,
  });
}
// tiny radial-gradient canvas textures for glows, flashes, scorch decals
function radialTex(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (const [o, col] of stops) g.addColorStop(o, col);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)']]);

// ============================== LEVEL GEOMETRY ==============================
const solidCells = new Set();          // dynamic solidity (walls + crates + closed doors)
const key = (x, y) => x + ',' + y;
const isWall = (x, y) => x < 0 || y < 0 || x >= GRID_W || y >= GRID_H || grid[y][x] === 1;

// walls: instanced boxes, only cells adjacent to a floor cell
{
  const cells = [];
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
    if (grid[y][x] !== 1) continue;
    solidCells.add(key(x, y));
    let nearFloor = false;
    for (let dy = -1; dy <= 1 && !nearFloor; dy++)
      for (let dx = -1; dx <= 1 && !nearFloor; dx++)
        if (!isWall(x + dx, y + dy)) nearFloor = true;
    if (nearFloor) cells.push([x, y]);
  }
  const geo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const groups = [[], [], []];
  for (const [x, y] of cells) groups[(x * 7 + y * 13) % 5 < 3 ? 0 : ((x + y) % 2 ? 1 : 2)].push([x, y]);
  [matWallA, matWallB, matWallC].forEach((mat, i) => {
    if (!groups[i].length) return;
    const inst = new THREE.InstancedMesh(geo, mat, groups[i].length);
    const m4 = new THREE.Matrix4();
    groups[i].forEach(([x, y], j) => {
      m4.setPosition(cx(x), WALL_H / 2, cx(y));
      inst.setMatrixAt(j, m4);
    });
    scene.add(inst);
  });
}

// floor & per-cell ceiling (boss arena is open to the toxic sky)
const inBossArena = (x, y) => x >= bossArena.x1 && x <= bossArena.x2 && y >= bossArena.y1 && y <= bossArena.y2;
{
  const w = GRID_W * CELL, h = GRID_H * CELL;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, h), matFloor);
  floor.rotation.x = -Math.PI / 2; floor.position.set(w / 2, 0, h / 2);
  floor.receiveShadow = true;
  scene.add(floor);

  const cells = [];
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++)
    if (grid[y][x] === 0 && !inBossArena(x, y)) cells.push([x, y]);
  const geo = new THREE.PlaneGeometry(CELL, CELL);
  const inst = new THREE.InstancedMesh(geo, matCeilTile, cells.length);
  const m4 = new THREE.Matrix4(), rot = new THREE.Matrix4().makeRotationX(Math.PI / 2);
  cells.forEach(([x, y], i) => {
    m4.copy(rot).setPosition(cx(x), WALL_H, cx(y));
    inst.setMatrixAt(i, m4);
  });
  inst.receiveShadow = true;
  scene.add(inst);

  // cool sky light spilling into the open boss arena
  const bcx = (bossArena.x1 + bossArena.x2) / 2, bcy = (bossArena.y1 + bossArena.y2) / 2;
  const moon = new THREE.DirectionalLight(0x8aa7cc, 1.15);
  moon.position.set(cx(bcx) + 14, 30, cx(bcy) - 10);
  moon.target.position.set(cx(bcx), 0, cx(bcy));
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024);
  moon.shadow.camera.left = -55; moon.shadow.camera.right = 55;
  moon.shadow.camera.top = 55; moon.shadow.camera.bottom = -55;
  scene.add(moon, moon.target);
}

// toxic sludge (GLSL shader) — one mesh per level-defined sludge rect
const sludgeUniforms = { uTime: { value: 0 } };
for (const sl of sludgeDefs) {
  const { x1, y1, x2, y2 } = sl;
  const w = (x2 - x1 + 1) * CELL, h = (y2 - y1 + 1) * CELL;
  const mat = new THREE.ShaderMaterial({
    uniforms: sludgeUniforms,
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; varying vec2 vUv;
      float n(vec2 p) { return sin(p.x * 6.0 + uTime) * sin(p.y * 7.0 - uTime * 1.3)
                             + sin((p.x + p.y) * 9.0 + uTime * 0.7) * 0.5; }
      void main() {
        vec2 p = vUv * 8.0;
        float v = n(p) + n(p * 2.1 + 13.7) * 0.4;
        vec3 col = mix(vec3(0.01, 0.12, 0.025), vec3(0.16, 0.6, 0.11), smoothstep(-0.6, 1.4, v));
        col += vec3(0.25, 0.65, 0.2) * pow(smoothstep(0.8, 1.6, v), 3.0) * 0.7;
        gl_FragColor = vec4(col, 0.92);
      }`,
    transparent: true,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x1 * CELL + w / 2, 0.04, y1 * CELL + h / 2);
  scene.add(m);
}

// point lights + emissive ceiling panels
for (const [gx, gy, color, intensity, flicker] of lightDefs) {
  const l = new THREE.PointLight(color, intensity * 2.0, 30, 1.6);
  l.position.set(cx(gx), WALL_H - 0.7, cx(gy));
  l.userData.flicker = flicker; l.userData.base = intensity * 2.0;
  scene.add(l);
  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(1.6, 1.6),
    new THREE.MeshBasicMaterial({ color })
  );
  panel.rotation.x = Math.PI / 2;
  panel.position.set(cx(gx), WALL_H - 0.02, cx(gy));
  scene.add(panel);
}
const allLights = [];
scene.traverse(o => { if (o.isPointLight) allLights.push(o); });

// crates
for (const [i, c] of crateDefs.entries()) {
  const s = CELL * 0.8;
  const m = new THREE.Mesh(new THREE.BoxGeometry(s, s * 0.75, s), matCrate);
  m.position.set(cx(c.x), s * 0.375, cx(c.y));
  m.rotation.y = rand(-0.2, 0.2);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  solidCells.add(key(c.x, c.y));
}

// explosive barrels: Y-billboard sprites, shoot to detonate, chain-react with splash damage
const barrelTex = spriteTex('barrel');
const barrelByCell = new Map(); // cell key -> barrel (cells are solid; rays resolve to the barrel)
const barrels = barrelDefs.map(b => {
  const bh = 1.7;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(bh * 304/384, bh), spriteMat(barrelTex, { emissiveIntensity: 0.25 }));
  mesh.position.set(cx(b.x), bh / 2, cx(b.y));
  mesh.castShadow = true;
  scene.add(mesh);
  solidCells.add(key(b.x, b.y));
  const obj = { gx: b.x, gy: b.y, x: cx(b.x), z: cx(b.y), mesh, hp: 14, dead: false, fuse: -1 };
  barrelByCell.set(key(b.x, b.y), obj);
  return obj;
});
const barrelAt = (gx, gy) => {
  const b = barrelByCell.get(key(gx, gy));
  return b && !b.dead ? b : null;
};

// wall decals (warning signs sheet) on walls facing open floor
{

// ============================== COLLISION & LOS ==============================
function cellSolid(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return true;
  return solidCells.has(key(gx, gy));
}
function collide(x, z, r) {
  const minX = Math.floor((x - r) / CELL), maxX = Math.floor((x + r) / CELL);
  const minY = Math.floor((z - r) / CELL), maxY = Math.floor((z + r) / CELL);
  for (let gy = minY; gy <= maxY; gy++)
    for (let gx = minX; gx <= maxX; gx++) {
      if (!cellSolid(gx, gy)) continue;
      const nx = clamp(x, gx * CELL, (gx + 1) * CELL);
      const nz = clamp(z, gy * CELL, (gy + 1) * CELL);
      if ((x - nx) ** 2 + (z - nz) ** 2 < r * r) return true;
    }
  return false;
}
function tryMove(o, dx, dz, r) {
  if (!collide(o.x + dx, o.z, r)) o.x += dx;
  if (!collide(o.x, o.z + dz, r)) o.z += dz;
}
function los(x1, z1, x2, z2) {
  const d = Math.hypot(x2 - x1, z2 - z1), steps = Math.ceil(d / 0.4);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const gx = Math.floor((x1 + (x2 - x1) * t) / CELL);
    const gy = Math.floor((z1 + (z2 - z1) * t) / CELL);
    if (cellSolid(gx, gy)) return false;
  }
  return true;
}

    goreGibs.push({ mesh: m, vx: rand(-5, 5), vy: rand(3, 8), vz: rand(-5, 5),
                    spin: rand(-8, 8), life: rand(1.2, 2.2), rest: false });
  }
}
// blood splat decals on the floor (reuse decal pool look, green toxic blood)
const bloodTex = radialTex([[0, 'rgba(40,180,40,0.85)'], [0.5, 'rgba(60,140,30,0.5)'], [1, 'rgba(0,0,0,0)']]);
function spawnBloodSplat(x, z) {
  if (decals.length >= 40) { const d = decals.shift(); scene.remove(d.mesh); }
  const m = new THREE.Mesh(decalGeo, new THREE.MeshBasicMaterial({ map: bloodTex, transparent: true, depthWrite: false, opacity: 0.85 }));
  m.scale.setScalar(rand(0.8, 1.4));
  m.rotation.x = -Math.PI / 2; m.rotation.z = rand(0, TAU);
  m.position.set(x, 0.05, z);
  scene.add(m);
  decals.push({ mesh: m, life: 12 });
}

// ---- explosions: visual burst + radial splash damage + chain detonation ----
let camShake = 0;
const EXPLO_RADIUS = 5.5, EXPLO_DMG = 90;
function explode(x, y, z, opts = {}) {
  const radius = opts.radius ?? EXPLO_RADIUS;
  const dmg = opts.dmg ?? EXPLO_DMG;
  sfx.boom();
  spawnPuff(x, y, z, 0xffdd66, radius * 0.9, 0.35);
  spawnPuff(x, y, z, 0xff5522, radius * 1.3, 0.5);
  spawnSparks(x, y, z, 0xffaa33, 18);
  spawnGibs(x, y, z, 0x553311, 10);
  // flash light
  const fl = new THREE.PointLight(0xffaa44, 60, radius * 4);
  fl.position.set(x, y, z); scene.add(fl);
  flashes.push({ light: fl, life: 0.22, max: 0.22 });
  // camera shake scaled by proximity
  const pd = Math.hypot(x - player.x, z - player.z);
  camShake = Math.max(camShake, clamp(1 - pd / (radius * 3), 0, 1) * 0.9);
  // splash damage: monsters
  for (const m of monsters) {
    if (m.dead) continue;
    const d = Math.hypot(x - m.x, z - m.z);
    if (d < radius) {
      const falloff = 1 - d / radius;
      damageMonster(m, dmg * falloff, m.x, 1.2, m.z, true);
    }
  }
  // splash damage: player
  const pdd = Math.hypot(x - player.x, z - player.z);
  if (pdd < radius) hurtPlayer(Math.round(dmg * 0.5 * (1 - pdd / radius)), x, z);
  // chain: nearby barrels get a short fuse
  for (const b of barrels) {
    if (b.dead || b.fuse >= 0) continue;
    if (Math.hypot(x - b.x, z - b.z) < radius + 1.5) b.fuse = rand(0.06, 0.18);
  }
}
function detonateBarrel(b) {
  if (b.dead) return;
  b.dead = true;
  scene.remove(b.mesh);
  solidCells.delete(key(b.gx, b.gy));
  explode(b.x, 1.0, b.z);
}

// transient explosion flash-lights
const flashes = [];

// hit a barrel with damage (hitscan/projectile/splash) — returns true if barrel was there
function damageBarrel(b, dmg) {
  if (b.dead) return;
  b.hp -= dmg;
  b.mesh.material.color.setRGB(3, 1.2, 1.2);
  setTimeout(() => { if (!b.dead) b.mesh.material.color.setRGB(1, 1, 1); }, 70);
  if (b.hp <= 0) detonateBarrel(b);
}

// kill confirm tick (crosshair flash + blip)
const crosshairEl = document.getElementById('crosshair');
function killTick() {
  crosshairEl.style.color = '#ff5';
  crosshairEl.style.transform = 'translate(-50%,-50%) scale(1.6)';
  beep(1200, 0.05, 'square', 0.05);
  setTimeout(() => { crosshairEl.style.color = '#6f6'; crosshairEl.style.transform = 'translate(-50%,-50%) scale(1)'; }, 110);
}

function fire() {
  const w = weapons[currentWeapon];
  if (player.fireCd > 0) return;
  if (w.ammo <= 0) { msg('OUT OF AMMO'); beep(120, 0.1, 'square', 0.04); player.fireCd = 0.3; return; }
  player.fireCd = w.cd;
  if (w.ammo !== Infinity) w.ammo--;
  player.kick = 1;
  w.sinceFire = 0;

  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);

  if (w.thrown) { // pipe bomb: lob a grenade with an arc
    sfx.pickup();
    throwPipeBomb(fwd);
    updateHud();
    return;
  }

  muzzle.color.set(VM_DEFS[currentWeapon].flash);
  muzzle.intensity = 30;
  const mzl = muzzleWorld();
  spawnPuff(mzl.x, mzl.y, mzl.z, VM_DEFS[currentWeapon].flash, 0.5, 0.08);
  if (currentWeapon !== 'plasma') ejectCasing(currentWeapon === 'shotgun');
  (currentWeapon === 'shotgun' ? sfx.shotgun : currentWeapon === 'plasma' ? sfx.plasma : sfx.pistol)();

  if (w.projectile) {
    const dir = fwd.clone();
    dir.x += rand(-w.spread, w.spread); dir.y += rand(-w.spread, w.spread); dir.normalize();
    spawnProjectile(player.x + fwd.x * 0.7, player.y - 0.15, player.z + fwd.z * 0.7, dir, 32, w.dmg, false, plasmaProjMat);
  } else {
    for (let p = 0; p < w.pellets; p++) {
      const dir = fwd.clone();
      dir.x += rand(-w.spread, w.spread);
      dir.y += rand(-w.spread, w.spread);
      dir.z += rand(-w.spread, w.spread);
      dir.normalize();
      hitscan(dir, w.dmg, VM_DEFS[currentWeapon].tracer);
    }
  }
  updateHud();
}

// ---- pipe bombs (thrown grenades, gravity + bounce, fuse) ----
const pipeBombs = [];
const pbGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.32, 8);
const pbMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7, roughness: 0.4, emissive: 0xff0000, emissiveIntensity: 0.4 });
function throwPipeBomb(fwd) {
  const m = new THREE.Mesh(pbGeo, pbMat.clone());
  m.position.set(player.x + fwd.x * 0.6, player.y - 0.1, player.z + fwd.z * 0.6);
  scene.add(m);
  pipeBombs.push({
    mesh: m, vx: fwd.x * 16, vy: 5 + fwd.y * 14, vz: fwd.z * 16,
    fuse: 2.2, blink: 0,
  });
}

function hitscan(dir, dmg, color) {
  let x = player.x, y = player.y, z = player.z;
  for (let i = 0; i < 300; i++) {
    x += dir.x * 0.25; y += dir.y * 0.25; z += dir.z * 0.25;
    if (y < 0 || y > WALL_H) break;
    const gx = Math.floor(x / CELL), gz = Math.floor(z / CELL);
    if (cellSolid(gx, gz)) {
      const b = barrelAt(gx, gz); // barrel cells are solid; the "wall" is the barrel
      if (b) {
        if (y < 2.2) { damageBarrel(b, dmg); break; }
        // above barrel height: shot sails over it — keep marching
      } else {
        spawnSparks(x - dir.x * 0.2, y - dir.y * 0.2, z - dir.z * 0.2, 0xffcc66, 5);
        spawnPuff(x - dir.x * 0.25, y - dir.y * 0.25, z - dir.z * 0.25, 0xffaa55, 0.3, 0.12);
        spawnDecal(x - dir.x * 0.22, y - dir.y * 0.22, z - dir.z * 0.22, dir);
        break;
      }
    }
    let hit = false;
    for (const m of monsters) {
      if (m.dead) continue;
      const cy = m.type === 'boss' ? 1.8 : m.fly ? (m.mesh.position.y || 2) : 1.1;
      const hr = m.radius + 0.25;
      if ((x - m.x) ** 2 + (y - cy) ** 2 * 0.5 + (z - m.z) ** 2 < hr * hr) {
        damageMonster(m, dmg, x, y, z);
        hit = true; break;
      }
    }
    if (hit) break;
  }
  spawnTracer(muzzleWorld(), x, y, z, color);
}

function damageMonster(m, dmg, hx, hy, hz, splash = false, attacker = null) {
  if (m.dead) return;
  m.hp -= dmg;
  m.hitFlash = 0.12;
  m.aggroed = true;
  // pain state: chance to flinch (interrupts movement/attack briefly), bigger on heavy hits
  if (m.type !== 'boss' && Math.random() < clamp(dmg / 40, 0.15, 0.85)) m.painT = rand(0.18, 0.4);
  // infighting: if hurt by another monster, retaliate against it
  if (attacker && attacker !== m) m.infight = attacker;
  sfx.mHit();
  if (!splash) spawnGore(hx ?? m.x, hy ?? 1.2, hz ?? m.z, 2);
  spawnGibs(hx ?? m.x, hy ?? 1.2, hz ?? m.z, 0x33cc22, 3);
  if (m.hp <= 0 && !m.dead) {
    m.dead = true;
    m.infight = null;
    if (!attacker) { // player-caused kills score; infight kills don't
      player.kills++;
      player.score += m.score;
      killTick();
    } else if (Math.random() < 0.6) {
      quip('Yeah! Fight each other, morons!');
    }
    sfx.mDie();
    spawnGore(m.x, 1.2, m.z, m.type === 'boss' ? 18 : 6, m.type === 'boss');
    spawnGibs(m.x, 1.2, m.z, 0x33cc22, m.type === 'boss' ? 30 : 8);
    spawnBloodSplat(m.x, m.z);
    if (m.type === 'drone') explode(m.x, m.mesh.position.y || 2, m.z, { radius: 3, dmg: 25 });
    if (m.type === 'boss') {
      sfx.boom();
      quip('The king is dead. Long live the janitor!', true);
      msg(`THE ${meta.bossName || 'SLUDGE KING'} IS DEAD — EXIT ACTIVE`, 4000);
      exitMat.color.set(0x22ff44);
      exitMat.emissive.set(0x00ff33);
      exitMat.emissiveIntensity = 2;
      for (const d of doorObjs) d.sealed = false;
    } else if (Math.random() < 0.45 && !attacker) {
      quip(KILL_QUIPS[Math.floor(Math.random() * KILL_QUIPS.length)]);
    }
    updateHud();
  }
}

// ============================== DAMAGE TO PLAYER ==============================
const dmgEl = document.getElementById('dmg');
const dmgArrowEl = document.getElementById('dmg-arrow');
function hurtPlayer(dmg, srcX, srcZ) {
  if (player.dead || gameEnded) return;
  player.hp -= dmg;
  hurtPulse = 1;
  camShake = Math.max(camShake, clamp(dmg / 30, 0.1, 0.6));
  sfx.hurt();
  dmgEl.style.opacity = 1;
  setTimeout(() => dmgEl.style.opacity = 0, 220);
  // directional damage indicator: arrow points toward the hit source
  if (srcX !== undefined) {
    const ang = Math.atan2(srcX - player.x, -(srcZ - player.z)); // world bearing
    const rel = ang - player.yaw; // relative to facing
    dmgArrowEl.style.transform = `translate(-50%,-50%) rotate(${rel}rad) translateY(-170px)`;
    dmgArrowEl.style.opacity = 1;
    clearTimeout(dmgArrowEl._t);
    dmgArrowEl._t = setTimeout(() => dmgArrowEl.style.opacity = 0, 600);
  }
  if (player.hp <= 25 && player.hp > 0) quip("I'm gonna need a bigger med-kit…");
  if (player.hp <= 0) {
    player.hp = 0;
    player.dead = true; gameEnded = true;
    document.exitPointerLock();
    showEndScreen(false);
  }
  updateHud();
}

const dialogEl = document.getElementById('dialog');

}

// ============================== PICKUP LOGIC ==============================
const flashEl = document.getElementById('pickup-flash');
function takePickup(p) {
  p.taken = true;
  scene.remove(p.mesh);
  flashEl.style.opacity = 1;
  setTimeout(() => flashEl.style.opacity = 0, 150);
  switch (p.kind) {
    case 'health':   player.hp = Math.min(100, player.hp + 25); sfx.pickup(); msg('+25 HEALTH'); break;
    case 'shells':   weapons.shotgun.ammo += 8; sfx.pickup(); msg('+8 SHELLS'); break;
    case 'cells':    weapons.plasma.ammo += 30; sfx.pickup(); msg('+30 CELLS'); break;
    case 'gold':     player.score += 100; sfx.gold(); msg('+100 GOLD'); if (Math.random() < 0.4) quip('Ka-ching!'); break;
    case 'treasure': player.score += 500; sfx.gold(); msg('+500 TREASURE!'); quip('Shiny!'); break;
    case 'keycard':  player.keycard = true; sfx.secret(); msg(KEY_NAME + ' ACQUIRED', 3000); quip('Access granted, baby!', true); break;
    case 'shotgun':  weapons.shotgun.owned = true; weapons.shotgun.ammo += 8; sfx.pickup(); msg('GOT THE BOOMSTICK  [2]', 3000); quip('Now THIS is a weapon!', true); switchWeapon('shotgun'); break;
    case 'plasma':   weapons.plasma.owned = true; weapons.plasma.ammo += 40; sfx.pickup(); msg('GOT THE PLASMA RIFLE  [3]', 3000); quip('Groovy.', true); switchWeapon('plasma'); break;
    case 'pipebomb': { const had = weapons.pipebomb.owned; weapons.pipebomb.owned = true; weapons.pipebomb.ammo += 3; sfx.pickup(); msg('+3 PIPE BOMBS  [4]', 3000); if (!had) { quip('Boom-mop time.', true); switchWeapon('pipebomb'); } break; }
  }
  updateHud();
}

// ============================== GAME LOOP ==============================
let bossSealed = false;
const boss = monsters.find(m => m.type === 'boss');

function update(dt) {
  if (!started || gameEnded) return;
  const t = performance.now() / 1000;

  // ---- player movement ----
  if (locked && !player.dead) {
    const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 4 : 9;
    let fx = 0, fz = 0;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    if (keys['KeyW']) { fx -= sin; fz -= cos; }
    if (keys['KeyS']) { fx += sin; fz += cos; }
    if (keys['KeyA']) { fx -= cos; fz += sin; }
    if (keys['KeyD']) { fx += cos; fz -= sin; }
    const len = Math.hypot(fx, fz);
    if (len > 0) {
      tryMove(player, fx / len * speed * dt, fz / len * speed * dt, player.radius);
      player.bobPhase += dt * speed * 1.6;
    }
    // jump + gravity
    if (keys['Space'] && player.onGround) { player.vy = 5.2; player.onGround = false; }
    player.vy -= 14 * dt;
    player.y += player.vy * dt;
    if (player.y <= 1.7) { player.y = 1.7; player.vy = 0; player.onGround = true; }

    if (mouseDown) fire();
  }
  player.fireCd -= dt;
  player.kick = Math.max(0, player.kick - dt * 6);
  muzzle.intensity = Math.max(0, muzzle.intensity - dt * 250);

  const shk = camShake * camShake; // ease-out
  camera.position.set(
    player.x + (Math.random() - 0.5) * shk * 0.3,
    player.y + Math.sin(player.bobPhase) * 0.045 + (Math.random() - 0.5) * shk * 0.25,
    player.z + (Math.random() - 0.5) * shk * 0.3);
  camera.rotation.y = player.yaw + (Math.random() - 0.5) * shk * 0.04;
  camera.rotation.x = player.pitch + player.kick * 0.06 + (Math.random() - 0.5) * shk * 0.04;

  // viewmodel sprite: frame state, bob, sway, recoil
  const cw = weapons[currentWeapon];
  cw.sinceFire = (cw.sinceFire ?? 99) + dt;
  const vm = cw.viewmodel;
  let vmf = 'idle';
  if (currentWeapon === 'shotgun') {
    if (cw.sinceFire < 0.12) vmf = 'fire';
    else if (cw.sinceFire > 0.28 && cw.sinceFire < 0.62) vmf = 'pump';
  } else if (currentWeapon === 'pipebomb') {
    if (cw.sinceFire < 0.45) vmf = 'fire'; // detonator hand after the throw
  } else if (cw.sinceFire < 0.09) vmf = 'fire';
  vmSetFrame(vm, vmf);
  const dk = Math.pow(0.002, dt);
  swayX *= dk; swayY *= dk;
  vm.position.x = 0.17 + Math.sin(player.bobPhase) * 0.02 + swayX;
  vm.position.y = -0.35 - Math.abs(Math.sin(player.bobPhase)) * 0.016 + swayY
                  + player.kick * 0.06 + (vmf === 'pump' ? -0.06 : 0);
  vm.position.z = -1 + player.kick * 0.18;
  vm.rotation.z = swayX * 0.8 + (vmf === 'pump' ? 0.05 : 0);

  // ---- doors ----
  for (const d of doorObjs) {
    const dx = cx(d.x) - player.x, dz = cx(d.y) - player.z;
    const near = dx * dx + dz * dz < (CELL * 1.7) ** 2;
    if (!d.opening && !d.secret && near && !d.sealed) {
      if (d.locked && !player.keycard) {
        if (!d._warned || t - d._warned > 2.5) { msg('NEED ' + KEY_NAME); beep(140, 0.15, 'square', 0.05); d._warned = t; }
      } else {
        d.opening = true; sfx.door();
        if (d.locked) msg('KEYCARD ACCEPTED', 1500);
      }
    }
    const target = d.opening && !d.sealed ? 1 : 0;
    if (d.open !== target) {
      d.open = clamp(d.open + (target > d.open ? dt : -dt) * 1.4, 0, 1);
      d.mesh.position.y = WALL_H / 2 + d.open * (WALL_H - 0.3);
      if (d.open > 0.65) solidCells.delete(key(d.x, d.y));
      else solidCells.add(key(d.x, d.y));
    }
    // auto-close normal doors when player leaves (not secrets)
    if (d.opening && !d.secret && !near && d.open === 1) d.opening = false;
  }

  // ---- boss arena seal ----
  const pgx = Math.floor(player.x / CELL), pgy = Math.floor(player.z / CELL);
  if (!bossSealed && boss && !boss.dead &&
      pgx >= bossArena.x1 + 1 && pgx <= bossArena.x2 && pgy >= bossArena.y1 + 1 && pgy <= bossArena.y2) {
    bossSealed = true;
    boss.aggroed = true;
    for (const d of doorObjs) if (d.locked) { d.sealed = true; d.opening = false; }
    msg('THE ' + (meta.bossName || 'SLUDGE KING') + ' AWAKENS', 3000);
    quip("That's one ugly mother-mopper.", true);
    sfx.boom();
  }

  // ---- pickups ----
  for (const p of pickups) {
    if (p.taken) continue;
    p.mesh.lookAt(player.x, p.mesh.position.y, player.z); // billboard
    p.mesh.position.y = 0.8 + Math.sin(t * 2.5 + p.spin) * 0.12;
    p.mesh.userData.halo.material.opacity = 0.28 + Math.sin(t * 3 + p.spin) * 0.12;
    const dx = p.mesh.position.x - player.x, dz = p.mesh.position.z - player.z;
    if (dx * dx + dz * dz < 1.4) takePickup(p);
  }

  // ---- NPC ----
  for (const n of npcObjs) {
    n.mark.position.y = 2.6 + Math.sin(t * 3) * 0.1;
    n.mesh.lookAt(player.x, 0, player.z);
    n.mat.map = n.mat.emissiveMap = t < n.talkUntil ? npcTex.talk : npcTex.idle;
  }

  // ---- explosive barrels (Y-billboard + fuse countdown) ----
  for (const b of barrels) {
    if (b.dead) continue;
    b.mesh.lookAt(player.x, b.mesh.position.y, player.z);
    if (b.fuse >= 0) {
      b.fuse -= dt;
      b.mesh.material.color.setRGB(2 + Math.sin(t * 40) * 1.5, 1, 1);
      if (b.fuse <= 0) detonateBarrel(b);
    }
  }

  // ---- monsters ----
  for (const m of monsters) {
    m.mesh.lookAt(player.x, m.mesh.position.y, player.z); // Y-axis billboard
    if (m.dead) {
      m.mesh.userData.setFrame('die');
      if (m.fly) m.mesh.position.y = Math.max(0.5, m.mesh.position.y - dt * 4); // shot-down drones drop
      else m.mesh.position.y = 0;
      const mat = m.mesh.userData.sprite.material;
      if (m.type !== 'boss') mat.opacity = Math.max(0.55, (mat.opacity ?? 1) - dt * 0.3);
      continue;
    }
    m.cd -= dt;
    if (m.attackAnim > 0) m.attackAnim -= dt;
    if (m.painT > 0) m.painT -= dt;
    if (m.hitFlash > 0) {
      m.hitFlash -= dt;
      m.mesh.userData.sprite.material.color.setRGB(4, 1.5, 1.5);
    } else {
      m.mesh.userData.sprite.material.color.setRGB(1, 1, 1);
    }

    // infighting: a wounded monster chases/attacks the monster that hit it
    let tx = player.x, tz = player.z, targetIsPlayer = true;
    if (m.infight && !m.infight.dead) { tx = m.infight.x; tz = m.infight.z; targetIsPlayer = false; }
    else m.infight = null;

    const dx = tx - m.x, dz = tz - m.z;
    const dist = Math.hypot(dx, dz) || 0.001;
    const seen = targetIsPlayer ? (dist < m.aggro && los(m.x, m.z, player.x, player.z)) : los(m.x, m.z, tx, tz);
    if (seen && targetIsPlayer) m.aggroed = true;
    if ((!m.aggroed && !m.infight) || (targetIsPlayer && player.dead)) {
      if (m.fly) { m.bob += dt * 2; m.mesh.position.set(m.x, 2.0 + Math.sin(m.bob) * 0.25, m.z); }
      else m.mesh.position.set(m.x, 0, m.z);
      m.mesh.userData.setFrame('idle');
      continue;
    }

    // pain stun: freeze in place, show attack/idle, skip movement+attack
    if (m.painT > 0) {
      m.mesh.userData.setFrame('attack');
      if (m.fly) { m.bob += dt * 4; m.mesh.position.y = 2.0 + Math.sin(m.bob) * 0.25; }
      continue;
    }

    // movement
    const wantRange = m.type === 'grunt' ? 7 : m.type === 'spitter' ? 9 : m.type === 'drone' ? 11 : 3.5;
    let moving = false;
    const sp = m.speed * dt;
    if (dist > wantRange || !seen) {
      tryMove(m, dx / dist * sp, dz / dist * sp, m.radius);
      moving = true;
    } else if (m.fly && seen) {
      // drones strafe sideways at range to be annoying targets
      const perp = { x: -dz / dist, z: dx / dist };
      if (collide(m.x + perp.x * sp * m.strafe, m.z + perp.z * sp * m.strafe, m.radius)) m.strafe *= -1;
      tryMove(m, perp.x * sp * m.strafe, perp.z * sp * m.strafe, m.radius);
      moving = true;
    }
    m.mesh.userData.setFrame(m.attackAnim > 0 ? 'attack' : moving ? 'walk' : 'idle');
    m.bob += dt * (m.fly ? 3 : 6);
    if (m.fly) m.mesh.position.set(m.x, 2.0 + Math.sin(m.bob) * 0.25, m.z);
    else m.mesh.position.set(m.x, Math.abs(Math.sin(m.bob)) * (moving ? 0.08 : 0.02), m.z);

    // attack
    if (seen && m.cd <= 0 && dist < m.attackRange) {
      m.cd = m.attackCd * rand(0.85, 1.25);
      m.attackAnim = 0.45;
      const srcY = m.fly ? 2.0 : (m.type === 'boss' ? 2.2 : 1.3);
      const dy = ((targetIsPlayer ? player.y - 0.2 : 1.2)) - srcY;
      const dir = new THREE.Vector3(dx, dy, dz).normalize();
      const onHit = (amt) => { // route damage to player or the infight target
        if (targetIsPlayer) hurtPlayer(amt, m.x, m.z);
        else damageMonster(m.infight, amt, m.infight.x, 1.2, m.infight.z, false, m);
      };
      if (m.type === 'grunt') {
        beep(260, 0.08, 'square', 0.05, -100);
        if (Math.random() < clamp(1 - dist / 28, 0.25, 0.9)) onHit(m.dmg);
        else spawnSparks(tx - dir.x + rand(-1, 1), rand(0.5, 2), tz - dir.z + rand(-1, 1), 0xffaa44, 3);
        spawnTracer(new THREE.Vector3(m.x, srcY, m.z), tx, 1.2, tz, 0xff7744);
      } else if (m.type === 'drone') {
        sfx.spit();
        spawnProjectile(m.x, srcY, m.z, dir, 22, m.dmg, true, droneProjMat, m);
      } else if (m.type === 'spitter') {
        sfx.spit();
        spawnProjectile(m.x, srcY, m.z, dir, 13, m.dmg, true, enemyProjMat, m);
      } else {
        sfx.spit();
        for (const a of [-0.22, 0, 0.22]) {
          const d2 = dir.clone();
          const c = Math.cos(a), s = Math.sin(a);
          [d2.x, d2.z] = [d2.x * c - d2.z * s, d2.x * s + d2.z * c];
          spawnProjectile(m.x, srcY, m.z, d2, 15, m.dmg, true, bossProjMat, m);
        }
        if (targetIsPlayer && dist < 3.5) hurtPlayer(m.dmg * 1.5, m.x, m.z);
      }
    }
  }

  // ---- projectiles ----
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.life -= dt;
    p.trailT -= dt;
    if (p.trailT <= 0) {
      p.trailT = 0.04;
      spawnPuff(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z, p.color, p.hostile ? 0.55 : 0.4, 0.22);
    }
    const px = p.mesh.position.x, py = p.mesh.position.y, pz = p.mesh.position.z;
    const pgx2 = Math.floor(px / CELL), pgz2 = Math.floor(pz / CELL);
    let kill = p.life <= 0 || py < 0 || py > WALL_H;
    if (!kill && cellSolid(pgx2, pgz2)) {
      const b = barrelAt(pgx2, pgz2);
      if (b) {
        if (py < 2.2) { damageBarrel(b, p.dmg || 40); kill = true; }
        // else: passes over the barrel
      } else kill = true;
    }
    if (!kill && p.hostile) {
      if ((px - player.x) ** 2 + (py - player.y + 0.5) ** 2 + (pz - player.z) ** 2 < 0.8) {
        hurtPlayer(p.dmg, p.owner ? p.owner.x : undefined, p.owner ? p.owner.z : undefined); kill = true;
      } else { // hostile shots can hit OTHER monsters → infighting
        for (const m of monsters) {
          if (m.dead || m === p.owner) continue;
          const cy = m.type === 'boss' ? 1.8 : m.fly ? (m.mesh.position.y || 2) : 1.1;
          const hr = m.radius + 0.3;
          if ((px - m.x) ** 2 + (py - cy) ** 2 * 0.5 + (pz - m.z) ** 2 < hr * hr) {
            damageMonster(m, p.dmg, px, py, pz, false, p.owner); kill = true; break;
          }
        }
      }
    } else if (!kill) {
      for (const m of monsters) {
        if (m.dead) continue;
        const cy = m.type === 'boss' ? 1.8 : m.fly ? (m.mesh.position.y || 2) : 1.1;
        const hr = m.radius + 0.3;
        if ((px - m.x) ** 2 + (py - cy) ** 2 * 0.5 + (pz - m.z) ** 2 < hr * hr) {
          damageMonster(m, p.dmg, px, py, pz); kill = true; break;
        }
      }
    }
    if (kill) {
      spawnSparks(px, py, pz, p.color, 5);
      spawnPuff(px, py, pz, p.color, 0.9, 0.18);
      if (p.light) projLights--;
      scene.remove(p.mesh);
      projectiles.splice(i, 1);
    }
  }

  // ---- gibs / sparks / casings ----
  for (let i = gibs.length - 1; i >= 0; i--) {
    const g = gibs[i];
    g.vy -= (g.spark ? 7 : 12) * dt;
    g.mesh.position.x += g.vx * dt;
    g.mesh.position.y += g.vy * dt;
    g.mesh.position.z += g.vz * dt;
    g.mesh.rotation.x += dt * 6; g.mesh.rotation.z += dt * 5;
    if (g.casing && g.mesh.position.y < 0.04 && g.vy < 0) {
      g.mesh.position.y = 0.04; g.vy *= -0.35; g.vx *= 0.55; g.vz *= 0.55;
    }
    g.life -= dt;
    if (g.spark) g.mesh.material.opacity = clamp(g.life * 3, 0, 1);
    if (g.life <= 0 || (!g.casing && g.mesh.position.y < 0)) { scene.remove(g.mesh); gibs.splice(i, 1); }
  }

  // ---- tracers / puffs / decals ----
  for (let i = tracers.length - 1; i >= 0; i--) {
    const tr = tracers[i]; tr.life -= dt;
    tr.mesh.material.opacity = Math.max(0, tr.life / tr.max) * 0.85;
    if (tr.life <= 0) { scene.remove(tr.mesh); tracers.splice(i, 1); }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const pf = puffs[i]; pf.life -= dt;
    pf.spr.material.opacity = Math.max(0, pf.life / pf.max) * 0.6;
    pf.spr.scale.multiplyScalar(Math.max(0, 1 - dt * 2));
    if (pf.life <= 0) { scene.remove(pf.spr); puffs.splice(i, 1); }
  }
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i]; d.life -= dt;
    if (d.life < 2) d.mesh.material.opacity = d.life / 2 * 0.9;
    if (d.life <= 0) { scene.remove(d.mesh); decals.splice(i, 1); }
  }

  // ---- gore gibs (billboarded flesh, tumble + settle flat) ----
  for (let i = goreGibs.length - 1; i >= 0; i--) {
    const g = goreGibs[i];
    if (!g.rest) {
      g.vy -= 14 * dt;
      g.mesh.position.x += g.vx * dt;
      g.mesh.position.y += g.vy * dt;
      g.mesh.position.z += g.vz * dt;
      g.angle = (g.angle ?? 0) + g.spin * dt;
      g.mesh.lookAt(player.x, g.mesh.position.y, player.z); // billboard while airborne
      g.mesh.rotateZ(g.angle);                               // …and tumble
      if (g.mesh.position.y <= 0.12) {
        g.mesh.position.y = 0.12; g.rest = true;
        g.mesh.rotation.set(-Math.PI / 2, 0, rand(0, TAU)); // lie flat on the floor
      }
    }
    g.life -= dt;
    if (g.life < 0.6) g.mesh.material.opacity = clamp(g.life / 0.6, 0, 1);
    if (g.life <= 0) { scene.remove(g.mesh); goreGibs.splice(i, 1); }
  }

  // ---- pipe bombs (gravity, bounce, fuse → explode) ----
  for (let i = pipeBombs.length - 1; i >= 0; i--) {
    const pb = pipeBombs[i];
    pb.vy -= 16 * dt;
    let nx = pb.mesh.position.x + pb.vx * dt;
    let nz = pb.mesh.position.z + pb.vz * dt;
    let ny = pb.mesh.position.y + pb.vy * dt;
    // wall bounce
    if (cellSolid(Math.floor(nx / CELL), Math.floor(pb.mesh.position.z / CELL))) { pb.vx *= -0.5; nx = pb.mesh.position.x; }
    if (cellSolid(Math.floor(pb.mesh.position.x / CELL), Math.floor(nz / CELL))) { pb.vz *= -0.5; nz = pb.mesh.position.z; }
    if (ny < 0.16) { ny = 0.16; pb.vy *= -0.4; pb.vx *= 0.7; pb.vz *= 0.7; }
    pb.mesh.position.set(nx, ny, nz);
    pb.mesh.rotation.x += dt * 9; pb.mesh.rotation.y += dt * 7;
    pb.blink += dt;
    pb.mesh.material.emissiveIntensity = 0.4 + Math.abs(Math.sin(pb.blink * (1 + (2.2 - pb.fuse) * 3))) * 1.6;
    pb.fuse -= dt;
    if (pb.fuse <= 0) {
      scene.remove(pb.mesh);
      pipeBombs.splice(i, 1);
      explode(pb.mesh.position.x, pb.mesh.position.y, pb.mesh.position.z);
    }
  }

  // ---- explosion flash lights ----
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.life -= dt;
    f.light.intensity = Math.max(0, f.life / f.max) * 60;
    if (f.life <= 0) { scene.remove(f.light); flashes.splice(i, 1); }
  }

  // ---- sludge damage: standing in toxic sludge hurts over time ----
  player._sludgeT = (player._sludgeT ?? 0) - dt;
  for (const s of sludgeDefs) {
    if (pgx >= s.x1 && pgx <= s.x2 && pgy >= s.y1 && pgy <= s.y2 && player.onGround) {
      if (player._sludgeT <= 0) { player._sludgeT = 0.5; hurtPlayer(4); }
      break;
    }
  }

  // ---- camera shake decay ----
  camShake = Math.max(0, camShake - dt * 3);

  // ---- flickering lights ----
  for (const l of allLights) {
    if (l.userData.flicker) l.intensity = l.userData.base * (Math.random() < 0.06 ? rand(0.1, 0.4) : rand(0.85, 1.05));
  }

  // ---- music intensity tracks nearby combat ----
  if (music) {
    let danger = 0;
    for (const m of monsters)
      if (!m.dead && m.aggroed && Math.hypot(m.x - player.x, m.z - player.z) < 26) danger++;
    const target = clamp(danger / 4, 0, 1);
    music.intensity += (target - music.intensity) * dt * 1.5;
    music.filt.frequency.value = 160 + music.intensity * 900;
    music.master.gain.value = 0.05 + music.intensity * 0.04;
    music.clangT -= dt;
    if (music.clangT <= 0) { // sparse distant industrial clangs
      music.clangT = rand(3, 9) - music.intensity * 2;
      beep(rand(700, 1500), 0.5, 'triangle', 0.015, -400);
      noise(0.35, 0.012, 350);
    }
  }
  sludgeUniforms.uTime.value = t;
  exitPad.rotation.y += dt * (boss?.dead ? 2 : 0.3);

  // ---- exit ----
  if (boss?.dead &&
      Math.hypot(cx(exitDef.x) - player.x, cx(exitDef.y) - player.z) < CELL * 0.6) {
    gameEnded = true;
    sfx.win();
    document.exitPointerLock();
    quip(meta.next ? 'Going down. Next stop: the core.' : 'Toxic sector? More like TOAST-ic sector.', true);
    showEndScreen(true);
  }
}

// ============================== END SCREEN (stats / rank / transition) ==============================
function showEndScreen(won) {
  const secs = Math.round((performance.now() - player.startTime) / 1000);
  const mm = String(Math.floor(secs / 60)), ss = String(secs % 60).padStart(2, '0');
  const totalSecrets = doorObjs.filter(d => d.secret).length;
  const rankEl = document.getElementById('end-rank');
  const titleEl = document.getElementById('end-title');
  const statsEl = document.getElementById('end-stats');
  const bestEl = document.getElementById('end-best');
  const goEl = document.getElementById('end-go');

  let rank = 'F', rankColor = '#f44';
  if (won) {
    const killScore = player.kills / monsters.length;
    const secretScore = totalSecrets ? player.secrets / totalSecrets : 1;
    const timeScore = clamp((meta.parTime || 240) / Math.max(secs, 1), 0, 1);
    const total = killScore * 0.5 + secretScore * 0.2 + timeScore * 0.3;
    rank = total > 0.92 ? 'S' : total > 0.78 ? 'A' : total > 0.6 ? 'B' : total > 0.42 ? 'C' : 'D';
    rankColor = { S: '#ffd700', A: '#6f6', B: '#6ff', C: '#fc3', D: '#f80' }[rank];
  }
  rankEl.textContent = rank;
  rankEl.style.color = rankColor;
  titleEl.textContent = won ? (meta.next ? `${meta.name} CLEANSED` : 'SECTOR SECURED — GAME COMPLETE') : 'YOU DIED';
  titleEl.style.color = won ? '#6f6' : '#f44';
  statsEl.innerHTML =
    `TIME ${mm}:${ss} (par ${Math.floor((meta.parTime||240)/60)}:${String((meta.parTime||240)%60).padStart(2,'0')})<br>` +
    `SCORE ${player.score} · KILLS ${player.kills}/${monsters.length} · SECRETS ${player.secrets}/${totalSecrets}`;

  // localStorage best per level
  let bestLine = '';
  try {
    const k = 'toxic_best_' + meta.id;
    const prev = JSON.parse(localStorage.getItem(k) || 'null');
    if (won && (!prev || player.score > prev.score)) {
      localStorage.setItem(k, JSON.stringify({ score: player.score, secs, rank }));
      bestLine = prev ? `NEW BEST! (was ${prev.score}, rank ${prev.rank})` : 'FIRST CLEAR RECORDED';
    } else if (prev) {
      bestLine = `BEST: ${prev.score} pts · rank ${prev.rank}`;
    }
  } catch (e) {}
  bestEl.textContent = bestLine;

  if (won && meta.next) {
    goEl.textContent = 'CLICK TO DESCEND TO SECTOR ' + (meta.id + 1);
    endAction = () => {
      try {
        sessionStorage.setItem('toxic_carry', JSON.stringify({
          score: player.score,
          shotgun: weapons.shotgun.owned ? { ammo: weapons.shotgun.ammo } : null,
          plasma: weapons.plasma.owned ? { ammo: weapons.plasma.ammo } : null,
          pipebomb: weapons.pipebomb.owned ? { ammo: weapons.pipebomb.ammo } : null,
        }));
      } catch (e) {}
      const p = new URLSearchParams(location.search);
      p.set('level', meta.next);
      location.search = p.toString();
    };
  } else {
    goEl.textContent = won ? 'CLICK TO PLAY AGAIN FROM SECTOR 1' : 'CLICK TO RETRY';
    endAction = () => {
      const p = new URLSearchParams(location.search);
      if (won) p.delete('level'); // full restart from sector 1; retry restarts current level
      location.search = p.toString() || '?';
    };
  }
  document.getElementById('endscreen').classList.remove('hidden');
  document.getElementById('resume').classList.add('hidden');
}

// ============================== POST-PROCESSING ==============================
// multisampled HDR target — EffectComposer's default RT has no MSAA, which shimmers badly on the metal textures
const composerRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, composerRT);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.7, 0.85);
composer.addPass(bloom);
const grainVignette = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uHurt: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uHurt;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + uTime * 13.0) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec2 d = (uv - 0.5) * (0.0035 + uHurt * 0.01);
      vec3 col;
      col.r = texture2D(tDiffuse, uv + d).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - d).b;
      float v = smoothstep(1.25, 0.45, length(uv - 0.5) * 1.6);
      col *= mix(0.55, 1.0, v);
      col += (hash(uv * vec2(1920.0, 1080.0)) - 0.5) * 0.025;
      col = mix(col, vec3(0.7, 0.05, 0.05), uHurt * 0.35);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(grainVignette);
composer.addPass(new OutputPass());
let hurtPulse = 0;

addEventListener('keydown', e => {
  if (e.code === 'KeyP') {
    QUALITY = !QUALITY;
    renderer.shadowMap.enabled = QUALITY;
    msg(QUALITY ? 'QUALITY: HIGH' : 'QUALITY: LOW (P to toggle)');
  }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  hurtPulse = Math.max(0, hurtPulse - dt * 2.5);
  grainVignette.uniforms.uTime.value = now / 1000;
  grainVignette.uniforms.uHurt.value = hurtPulse;
  if (QUALITY) composer.render();
  else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (TEST) window.__game = { player, monsters, weapons, doorObjs, pickups, barrels, pipeBombs, meta,
  get locked() { return locked; }, fire, takePickup, hurtPlayer, explode, switchWeapon, showEndScreen };
</script>
</body>
</html>
