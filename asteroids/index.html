<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON ASTEROIDS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05050f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game {
    display: block;
    width: 100vw; height: 100vh;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 14px 20px;
    color: #0ff;
    font-size: 18px;
    text-shadow: 0 0 8px #0ff;
    pointer-events: none;
    letter-spacing: 2px;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; text-align: center;
    background: rgba(5,5,15,0.55);
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(36px, 8vw, 72px);
    color: #f0f;
    text-shadow: 0 0 12px #f0f, 0 0 40px #f0f;
    letter-spacing: 8px;
    margin-bottom: 16px;
  }
  #overlay p {
    color: #0ff;
    text-shadow: 0 0 8px #0ff;
    font-size: clamp(14px, 3vw, 20px);
    line-height: 1.8;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #overlay .blink {
    margin-top: 24px;
    animation: blink 1.1s steps(2) infinite;
    color: #ff0;
    text-shadow: 0 0 10px #ff0;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* Touch controls */
  .touch-btn {
    position: fixed;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,255,0.5);
    background: rgba(0,255,255,0.08);
    color: #0ff;
    font-size: 24px;
    display: none;
    align-items: center; justify-content: center;
    text-shadow: 0 0 8px #0ff;
    z-index: 10;
  }
  .touch-btn:active, .touch-btn.pressed {
    background: rgba(0,255,255,0.3);
  }
  body.touch .touch-btn { display: flex; }
  #btn-left  { left: 20px;  bottom: 30px; }
  #btn-right { left: 104px; bottom: 30px; }
  #btn-thrust{ right: 104px; bottom: 30px; border-color: rgba(255,0,255,0.5); color: #f0f; text-shadow: 0 0 8px #f0f; }
  #btn-fire  { right: 20px; bottom: 110px; border-color: rgba(255,255,0,0.5); color: #ff0; text-shadow: 0 0 8px #ff0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="score">SCORE 0</span>
  <span id="level">LEVEL 1</span>
  <span id="lives">▲ ▲ ▲</span>
</div>
<div id="overlay">
  <h1>NEON ASTEROIDS</h1>
  <p id="overlay-sub">← → rotate &nbsp;·&nbsp; ↑ thrust &nbsp;·&nbsp; SPACE fire</p>
  <p class="blink" id="overlay-start">PRESS SPACE OR TAP TO START</p>
</div>
<div class="touch-btn" id="btn-left">⟲</div>
<div class="touch-btn" id="btn-right">⟳</div>
<div class="touch-btn" id="btn-thrust">▲</div>
<div class="touch-btn" id="btn-fire">●</div>

<script>
(() => {
'use strict';

// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const hudScore = document.getElementById('score');
const hudLevel = document.getElementById('level');
const hudLives = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const overlaySub = document.getElementById('overlay-sub');

// ---------- Audio (tiny synth, no assets) ----------
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  try {
    const a = audio();
    if (a.state === 'suspended') a.resume();
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  fire:    () => beep(880, 0.09, 'square', 0.05, -500),
  thrust:  () => beep(70, 0.06, 'sawtooth', 0.03, 20),
  boomBig: () => beep(90, 0.4, 'sawtooth', 0.12, -60),
  boomSm:  () => beep(200, 0.2, 'sawtooth', 0.08, -150),
  die:     () => beep(300, 0.7, 'sawtooth', 0.12, -280),
  level:   () => { beep(440, 0.1); setTimeout(() => beep(660, 0.1), 110); setTimeout(() => beep(880, 0.18), 220); },
};

// ---------- Input ----------
const keys = { left: false, right: false, thrust: false, fire: false };

const keymap = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'thrust', KeyW: 'thrust',
  Space: 'fire',
};
window.addEventListener('keydown', e => {
  if (keymap[e.code]) { keys[keymap[e.code]] = true; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') maybeStart();
});
window.addEventListener('keyup', e => {
  if (keymap[e.code]) { keys[keymap[e.code]] = false; e.preventDefault(); }
});

// Touch
function bindTouch(id, key) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); keys[key] = true; el.classList.add('pressed'); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-thrust', 'thrust');
bindTouch('btn-fire', 'fire');

window.addEventListener('touchstart', () => {
  document.body.classList.add('touch');
}, { once: true });

overlay.addEventListener('pointerdown', () => maybeStart());

// ---------- Helpers ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const wrap = (v, max) => (v < 0 ? v + max : v >= max ? v - max : v);
const dist2 = (a, b) => {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
};

// ---------- Game state ----------
let state = 'title'; // title | playing | gameover
let ship, bullets, asteroids, particles, stars;
let score = 0, lives = 3, level = 1;
let fireCooldown = 0, respawnTimer = 0, levelTimer = 0;
let shake = 0;

function makeStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, tw: Math.random() * TAU });
  }
}
makeStars();

function makeShip() {
  return {
    x: W / 2, y: H / 2, vx: 0, vy: 0,
    angle: -Math.PI / 2, radius: 12,
    invuln: 2.5, dead: false,
  };
}

function makeAsteroid(x, y, size) {
  // size: 3 = big, 2 = medium, 1 = small
  const r = size * 14 + 8;
  const verts = [];
  const n = 9 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    verts.push(rand(0.72, 1.18));
  }
  const speed = rand(20, 50) + (3 - size) * 22 + level * 4;
  const a = Math.random() * TAU;
  return {
    x, y, size,
    radius: r,
    vx: Math.cos(a) * speed,
    vy: Math.sin(a) * speed,
    angle: Math.random() * TAU,
    spin: rand(-1.2, 1.2),
    verts, n,
    hue: rand(160, 320),
  };
}

function spawnAsteroids(count) {
  for (let i = 0; i < count; i++) {
    // spawn away from the ship
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (ship && Math.hypot(x - ship.x, y - ship.y) < 220);
    asteroids.push(makeAsteroid(x, y, 3));
  }
}

function explode(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const s = rand(speed * 0.2, speed);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: rand(0.3, 0.9),
      maxLife: 0.9,
      color,
      r: rand(1, 2.6),
    });
  }
}

function startGame() {
  score = 0; lives = 3; level = 1;
  ship = makeShip();
  bullets = []; asteroids = []; particles = [];
  spawnAsteroids(3 + level);
  state = 'playing';
  overlay.classList.add('hidden');
  updateHud();
}

function maybeStart() {
  if (state === 'title' || state === 'gameover') {
    audio(); // unlock on user gesture
    startGame();
  }
}

function updateHud() {
  hudScore.textContent = 'SCORE ' + score;
  hudLevel.textContent = 'LEVEL ' + level;
  hudLives.textContent = lives > 0 ? Array(lives).fill('▲').join(' ') : '';
}

function gameOver() {
  state = 'gameover';
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlaySub.textContent = 'FINAL SCORE: ' + score;
  document.getElementById('overlay-start').textContent = 'PRESS SPACE OR TAP TO RETRY';
}

// ---------- Update ----------
function update(dt) {
  // stars twinkle always
  for (const s of stars) s.tw += dt * 2;

  if (state !== 'playing') return;

  fireCooldown -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  // --- Ship ---
  if (!ship.dead) {
    if (keys.left)  ship.angle -= 4.2 * dt;
    if (keys.right) ship.angle += 4.2 * dt;
    if (keys.thrust) {
      const ACC = 260;
      ship.vx += Math.cos(ship.angle) * ACC * dt;
      ship.vy += Math.sin(ship.angle) * ACC * dt;
      if (Math.random() < 0.7) {
        // exhaust particles
        const ba = ship.angle + Math.PI + rand(-0.35, 0.35);
        particles.push({
          x: ship.x + Math.cos(ship.angle + Math.PI) * 12,
          y: ship.y + Math.sin(ship.angle + Math.PI) * 12,
          vx: Math.cos(ba) * rand(80, 160) + ship.vx * 0.4,
          vy: Math.sin(ba) * rand(80, 160) + ship.vy * 0.4,
          life: rand(0.15, 0.35), maxLife: 0.35,
          color: Math.random() < 0.5 ? '#f0f' : '#ff8800',
          r: rand(1, 2.2),
        });
      }
      if (Math.random() < 0.3) sfx.thrust();
    }
    // friction + speed cap
    const damp = Math.pow(0.45, dt);
    ship.vx *= damp; ship.vy *= damp;
    const sp = Math.hypot(ship.vx, ship.vy), MAX = 420;
    if (sp > MAX) { ship.vx = ship.vx / sp * MAX; ship.vy = ship.vy / sp * MAX; }

    ship.x = wrap(ship.x + ship.vx * dt, W);
    ship.y = wrap(ship.y + ship.vy * dt, H);
    if (ship.invuln > 0) ship.invuln -= dt;

    // fire
    if (keys.fire && fireCooldown <= 0) {
      fireCooldown = 0.22;
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * 14,
        y: ship.y + Math.sin(ship.angle) * 14,
        vx: Math.cos(ship.angle) * 560 + ship.vx,
        vy: Math.sin(ship.angle) * 560 + ship.vy,
        life: 1.1,
      });
      sfx.fire();
    }
  } else {
    respawnTimer -= dt;
    if (respawnTimer <= 0) {
      if (lives > 0) {
        ship = makeShip();
      } else {
        gameOver();
      }
    }
  }

  // --- Bullets ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x = wrap(b.x + b.vx * dt, W);
    b.y = wrap(b.y + b.vy * dt, H);
    b.life -= dt;
    if (b.life <= 0) bullets.splice(i, 1);
  }

  // --- Asteroids ---
  for (const a of asteroids) {
    a.x = wrap(a.x + a.vx * dt, W);
    a.y = wrap(a.y + a.vy * dt, H);
    a.angle += a.spin * dt;
  }

  // --- Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.2, dt); p.vy *= Math.pow(0.2, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // --- Collisions: bullets vs asteroids ---
  outer:
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (dist2(a, b) < a.radius * a.radius) {
        bullets.splice(j, 1);
        asteroids.splice(i, 1);
        score += a.size === 3 ? 20 : a.size === 2 ? 50 : 100;
        const col = `hsl(${a.hue}, 100%, 65%)`;
        explode(a.x, a.y, col, a.size * 10, 140 + a.size * 40);
        shake = Math.max(shake, a.size * 1.5);
        if (a.size > 1) {
          sfx.boomSm();
          for (let k = 0; k < 2; k++) {
            const child = makeAsteroid(a.x, a.y, a.size - 1);
            asteroids.push(child);
          }
        } else {
          sfx.boomSm();
        }
        updateHud();
        continue outer;
      }
    }
  }

  // --- Collisions: ship vs asteroids ---
  if (!ship.dead && ship.invuln <= 0) {
    for (const a of asteroids) {
      const r = a.radius + ship.radius * 0.7;
      if (dist2(a, ship) < r * r) {
        ship.dead = true;
        lives--;
        respawnTimer = 1.8;
        explode(ship.x, ship.y, '#0ff', 40, 260);
        explode(ship.x, ship.y, '#f0f', 25, 180);
        shake = 10;
        sfx.die();
        updateHud();
        break;
      }
    }
  }

  // --- Level cleared ---
  if (asteroids.length === 0) {
    levelTimer -= dt;
    if (levelTimer <= 0) {
      level++;
      sfx.level();
      spawnAsteroids(2 + level);
      levelTimer = 0;
      updateHud();
    }
  } else {
    levelTimer = 1.4;
  }
}

// ---------- Render ----------
function drawShip(s) {
  if (s.dead) return;
  if (s.invuln > 0 && Math.floor(s.invuln * 10) % 2 === 0) return; // blink

  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(-10, 9);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-10, -9);
  ctx.closePath();
  ctx.stroke();

  if (keys.thrust && Math.random() < 0.85) {
    ctx.strokeStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.beginPath();
    ctx.moveTo(-8, 4);
    ctx.lineTo(-16 - Math.random() * 7, 0);
    ctx.lineTo(-8, -4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.angle);
  const col = `hsl(${a.hue}, 100%, 65%)`;
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.shadowColor = col;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  for (let i = 0; i < a.n; i++) {
    const ang = (i / a.n) * TAU;
    const r = a.radius * a.verts[i];
    const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate(rand(-shake, shake), rand(-shake, shake));
  }

  // bg
  ctx.fillStyle = '#05050f';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // stars
  ctx.shadowBlur = 0;
  for (const s of stars) {
    const a = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(s.tw));
    ctx.fillStyle = `rgba(180, 200, 255, ${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }

  if (state === 'playing' || state === 'gameover') {
    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 12;
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, TAU);
      ctx.fill();
    }

    for (const a of asteroids) drawAsteroid(a);
    if (ship) drawShip(ship);
  }

  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
